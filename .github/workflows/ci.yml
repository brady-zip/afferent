name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and generated drift
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install the pinned npm release client
        run: |
          npm install --global --prefix "$RUNNER_TEMP/afferent-npm" npm@11.15.0
          echo "$RUNNER_TEMP/afferent-npm/bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/afferent-npm/bin:$PATH"
          node --version
          npm --version
          test "$(npm --version)" = "11.15.0"
      - name: Install from the lockfile
        run: npm ci
      - name: Verify release surface drift
        run: npm run verify:version-sync -- --surfaces-only
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test

  candidate:
    name: Build immutable release candidate
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install the pinned npm release client
        run: |
          npm install --global --prefix "$RUNNER_TEMP/afferent-npm" npm@11.15.0
          echo "$RUNNER_TEMP/afferent-npm/bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/afferent-npm/bin:$PATH"
          node --version
          npm --version
          test "$(npm --version)" = "11.15.0"
      - name: Install from the lockfile
        run: npm ci
      - name: Build and test one candidate artifact set
        run: npm run verify:release-candidate -- --build --output "$RUNNER_TEMP/release-candidate"
      - name: Upload candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: afferent-release-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/release-candidate
          if-no-files-found: error
          retention-days: 7

  local-acceptance:
    name: Credential-free local Phase 4 acceptance
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install the pinned npm release client
        run: |
          npm install --global --prefix "$RUNNER_TEMP/afferent-npm" npm@11.15.0
          echo "$RUNNER_TEMP/afferent-npm/bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/afferent-npm/bin:$PATH"
          node --version
          npm --version
          test "$(npm --version)" = "11.15.0"
      - name: Install from the lockfile
        run: npm ci
      - name: Download the exact candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: afferent-release-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/release-candidate
      - name: Install the pinned browser and system dependencies
        run: npx --no-install playwright install --with-deps chromium
      - name: Run the complete local acceptance gate
        run: npm run verify:phase4
      - name: Bind Phase 4 evidence to the candidate checksum
        run: npm run verify:release-candidate -- --finalize --candidate-dir "$RUNNER_TEMP/release-candidate" --phase4-candidate .demo-candidate
      - name: Upload the verified candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: afferent-verified-release-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/release-candidate
          if-no-files-found: error
          retention-days: 7
